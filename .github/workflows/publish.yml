name: Publish to npm

on:
  push:
    branches: [master]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build package
        run: bun run build

      - name: Publish to npm via trusted publisher OIDC
        run: |
          set -euo pipefail

          CURRENT=$(node -p "require('./package.json').version")
          if npm view "@gluedly/mcp-server@${CURRENT}" version >/dev/null 2>&1; then
            echo "Version $CURRENT already published, skipping"
            exit 0
          fi

          echo "node=$(node -v) npm=$(npm -v)"
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::Missing GitHub OIDC request env (need permissions.id-token: write)"
            exit 1
          fi

          # 1) GitHub OIDC id token for audience npm:registry.npmjs.org
          AUDIENCE='npm:registry.npmjs.org'
          REQUEST_URL=$(node -e '
            const u = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
            u.searchParams.set("audience", process.argv[1]);
            process.stdout.write(u.href);
          ' "$AUDIENCE")
          ID_JSON=$(curl -fsS \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            -H "Accept: application/json" \
            "$REQUEST_URL")
          ID_TOKEN=$(node -e '
            const j = JSON.parse(process.argv[1]);
            if (!j.value) { console.error(process.argv[1]); process.exit(2); }
            process.stdout.write(j.value);
          ' "$ID_JSON")

          echo "GitHub OIDC claims (must match Trusted Publisher):"
          node -e '
            const p = JSON.parse(Buffer.from(process.argv[1].split(".")[1], "base64url").toString());
            console.log(JSON.stringify({
              sub: p.sub,
              repository: p.repository,
              repository_owner: p.repository_owner,
              job_workflow_ref: p.job_workflow_ref,
              ref: p.ref,
              environment: p.environment,
              repository_visibility: p.repository_visibility,
              aud: p.aud,
            }, null, 2));
          ' "$ID_TOKEN"

          # 2) Exchange for short-lived npm token (same as npm CLI trusted publishing)
          # npm uses npa().escapedName → @scope%2fname (keep @, encode / only).
          # Do NOT use encodeURIComponent (that turns @ into %40 and npm returns package not found).
          EXCHANGE_URL=$(node -e 'process.stdout.write(new URL("/-/npm/v1/oidc/token/exchange/package/@gluedly%2fmcp-server", "https://registry.npmjs.org/").href)')
          echo "Exchanging at: ${EXCHANGE_URL}"
          HTTP=$(curl -sS -g -o "$RUNNER_TEMP/oidc-exchange.json" -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${ID_TOKEN}" \
            -H "Accept: application/json" \
            -- "$EXCHANGE_URL")
          echo "Exchange HTTP ${HTTP}"
          cat "$RUNNER_TEMP/oidc-exchange.json"
          echo
          if [ "$HTTP" != "200" ] && [ "$HTTP" != "201" ]; then
            echo "::error::Trusted Publisher OIDC exchange failed. Compare claims above to npm Trusted Publisher (repo Gluedly/mcp-server, workflow publish.yml, environment npm)."
            exit 1
          fi

          NPM_PUBLISH_TOKEN=$(node -e '
            const j = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            if (!j.token) { console.error(JSON.stringify(j)); process.exit(2); }
            process.stdout.write(j.token);
          ' "$RUNNER_TEMP/oidc-exchange.json")

          # 3) Publish with the short-lived token from Trusted Publisher (not a long-lived NPM_TOKEN)
          printf '%s\n' \
            "//registry.npmjs.org/:_authToken=${NPM_PUBLISH_TOKEN}" \
            "registry=https://registry.npmjs.org/" \
            > "$RUNNER_TEMP/npmrc-oidc-publish"
          export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npmrc-oidc-publish"
          unset NODE_AUTH_TOKEN || true
          npm publish --access public
