name: Publish to npm

on:
  push:
    branches: [master]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build package
        run: bun run build

      - name: Prepare npm OIDC publish
        run: |
          echo "node=$(node -v) npm=$(npm -v)"
          echo "OIDC URL present: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
          # setup-node may write _authToken into NPM_CONFIG_USERCONFIG
          # ($RUNNER_TEMP/.npmrc), which blocks OIDC when NODE_AUTH_TOKEN is unset.
          for npmrc in "${NPM_CONFIG_USERCONFIG:-}" "$HOME/.npmrc" .npmrc; do
            if [ -n "$npmrc" ] && [ -f "$npmrc" ]; then
              echo "Cleaning auth shim from $npmrc"
              sed -i '/_authToken/d' "$npmrc"
              sed -i '/always-auth/d' "$npmrc"
            fi
          done
          # Registry only — no token line — so npm uses trusted publishing.
          printf 'registry=https://registry.npmjs.org\n' > "$RUNNER_TEMP/npmrc-oidc"
          echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/npmrc-oidc" >> "$GITHUB_ENV"

      - name: Publish to npm
        run: |
          unset NODE_AUTH_TOKEN
          CURRENT=$(node -p "require('./package.json').version")
          if npm view "@gluedly/mcp-server@${CURRENT}" version >/dev/null 2>&1; then
            echo "Version $CURRENT already published, skipping"
            exit 0
          fi
          npm publish --access public
