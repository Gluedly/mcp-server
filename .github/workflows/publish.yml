name: Publish to npm

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Do not set registry-url: setup-node would write an .npmrc with
      # ${NODE_AUTH_TOKEN}, which makes npm use token auth and breaks OIDC
      # trusted publishing (misleading 404 on publish).
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build package
        run: bun run build

      - name: Publish to npm
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          if npm view "@gluedly/mcp-server@${CURRENT}" version >/dev/null 2>&1; then
            echo "Version $CURRENT already published, skipping"
            exit 0
          fi
          rm -f .npmrc
          unset NODE_AUTH_TOKEN
          npm publish --access public
